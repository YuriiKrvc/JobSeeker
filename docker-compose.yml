services:
  postgres:
    image: postgres:17-alpine
    container_name: jobseeker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobseeker
      POSTGRES_PASSWORD: jobseeker
      POSTGRES_DB: jobseeker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobseeker -d jobseeker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
